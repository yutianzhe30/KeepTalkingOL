name: Export to Web

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  export-web:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/

      - name: Web Build
        run: |
          mkdir -p Export
          godot --headless --export-release "Web" Export/index.html

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web Build
          path: Export
